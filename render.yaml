# Render Blueprint — 一键部署 SkillSwipe 静态站点
# 用法：Render Dashboard → New → Blueprint → 选本仓库（根目录含本文件）
# 或在 New → Static Site 手动配置（Build Command 留空，Publish Directory 填 "."）
services:
  - type: static
    name: skillswipe
    runtime: static
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html